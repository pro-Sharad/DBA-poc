# This is a Declarative Automation Bundle definition for dba_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dba_bundle
  uuid: 3342db92-42f6-45cc-a15d-3a72350313e5

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405612012271908.8.azuredatabricks.net
    variables:
      catalog: dba-dev-catalog
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://adb-7405612012271908.8.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/sharadbj9655@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/sharadbj9655@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dba-prod-catalog
      schema: rnd
    permissions:
      - user_name: sharadbj9655@gmail.com
        level: CAN_MANAGE
